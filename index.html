<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thorun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- three.js는 js/vendor에 포함되어 있어서 외부 CDN 없이 GitHub Pages에서 그대로 동작한다. -->
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="세계관 지구본과 인명록"></canvas>

  <button id="to-book" class="nav-btn nav-right" type="button" aria-label="인명록 열기">
    <span>인명록</span><span class="arrow" aria-hidden="true">&rsaquo;</span>
  </button>
  <button id="to-globe" class="nav-btn nav-left" type="button" aria-label="지구본으로 돌아가기" hidden>
    <span class="arrow" aria-hidden="true">&lsaquo;</span><span>세계</span>
  </button>

  <!-- 대륙 바로가기 (지구본 화면에서만 표시) -->
  <nav id="continent-list" class="continent-list" aria-label="대륙 목록"></nav>

  <!-- 대륙 상세 팝업 -->
  <div id="continent-popup" class="popup" hidden>
    <div class="popup-backdrop" data-close></div>
    <section class="popup-panel" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <button class="popup-close" type="button" aria-label="닫기" data-close>&times;</button>
      <div class="popup-media">
        <img id="popup-image" alt="" hidden>
        <div id="popup-image-empty" class="popup-empty">이미지 준비 중</div>
      </div>
      <div class="popup-body">
        <h2 id="popup-title"></h2>
        <div id="popup-desc" class="popup-desc"></div>
      </div>
    </section>
  </div>

  <div id="loading" aria-live="polite">불러오는 중…</div>
  <noscript><p class="noscript">이 페이지는 JavaScript와 WebGL이 필요합니다.</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
